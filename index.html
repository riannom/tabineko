  var POUNCE = [[0, PS.crouch], [170, PS.crouchDeep], [250, PS.launch], [290, PS.push], [340, PS.flight], [455, PS.reach], [515, PS.landC], [575, PS.landH], [700, PS.land]].map(function (k) { return [k[0] / PT, k[1]]; });
  // Two real pats: cock back and up -> fast swipe forward and down -> contact (the ball rolls a little and rocks) -> retract;
  // again, reaching a touch further, and the second one sends it rolling off.
  var BT = 1150, HIT1 = 190, HIT2 = 590;
  var BAT = [[0, PS.land], [110, PS.batCock], [HIT1, PS.batHit], [250, PS.batHit], [380, PS.batRet], [510, PS.batCock], [HIT2, PS.batHit2], [650, PS.batHit2], [820, PS.batRet], [1000, PS.bat0], [BT, PS.bat0]].map(function (k) { return [k[0] / BT, k[1]]; });
  var VF = PDIST / 252.5;
  function pD(t) {   // horizontal travel during the pounce (local units)
    if (t < 200) return 0;
    if (t < 290) return VF * (t - 200) * (t - 200) / 180;
    if (t < 455) return VF * (45 + t - 290);
    var u = Math.min(t - 455, 85); return VF * (210 + u - u * u / 170);
  }
  function pLift(t) { var u = (t - 290) / 165; return u > 0 && u < 1 ? 8.5 * 4 * u * (1 - u) : 0; }
  function pPitch(t) { return t < 190 ? 0 : t < 290 ? 0.14 * smooth((t - 190) / 100) : t < 455 ? lerp(0.14, -0.26, smooth((t - 290) / 165)) : -0.26 * (1 - smooth((t - 455) / 120)); }

  function schedule(ms) { due = Date.now() + ms; clearTimeout(timer); if (!document.hidden) timer = setTimeout(begin, ms); }

  function begin() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var tag = document.querySelector("main p").getBoundingClientRect();
    var base = vw < 600 ? 1.05 : 1.62;
    var s = Math.min(base, (vh - tag.bottom - 30) / 40);      // keep the whole scene below the text
    if (s < 0.6) { schedule(40000 + Math.random() * 40000); return; }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = vw; H = Math.ceil(40 * s + 12);
    canvas.style.height = H + "px";
    canvas.width = off.width = Math.round(W * dpr); canvas.height = off.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = 4.2 * s, v0 = clamp(W / 4200, 0.18, 0.34);         // px per ms
    var stopX = W * (0.6 + Math.random() * 0.16);
    var T1 = 2 * (stopX + r) / v0;                             // yarn eases to a stop at stopX
    var vc = v0 * 1.15, landX = stopX - r - REACH * s, pStart = landX - PDIST * s, stalkX = pStart - vc * 225;
    run = { s: s, r: r, g: H - 6, v0: v0, vt: 0.085 * s, vc: vc, stopX: stopX, T1: T1, landX: landX, pStart: pStart, stalkX: stalkX,
            catStart: T1 + 200 - (stalkX + 60 * s) / vc,
            t: 0, yx: -r, yv: v0, rot: 0, kicked: false, nudged: false, nt: 0, se: null, slen: 0.7 * r + 30 * s, sev: 0, cx: -60 * s, phi: 0, mode: "wait", mt: 0, cv: 0, dir: ltr ? 1 : -1,
            feet: null, tail: null, pouch: 0, pv: 0, hip: null };
    ltr = !ltr;
    start();
  }

  function step(dt) {
    var R = run, s = R.s;
    R.t += dt;
    // Yarn
    var px = R.yx;
    if (R.kicked) { R.yv = Math.max(R.yv * Math.pow(0.9995, dt), 0.2); R.yx += R.yv * dt; }
    else if (R.nudged) {   // first pat: rolls a short way, then rocks back and forth as it settles
      var tn = R.t - R.nt; R.yx = R.stopX + D1 * R.s * (1 - Math.exp(-tn / 70)) + 0.3 * R.r * Math.sin(tn / 40) * Math.exp(-tn / 150);
    } else { var u = Math.min(R.t / R.T1, 1); R.yx = -R.r + (R.stopX + R.r) * ease(u); }
    // the strand: its free end lies where it is until the strand is out to its full length, then it is dragged along
    var se0 = R.se === null ? R.yx - R.slen : R.se;
    R.se = Math.max(se0, R.yx - R.slen); R.sev = (R.se - se0) / dt;
    R.yspeed = (R.yx - px) / dt;
    R.rot += (R.yx - px) / R.r;
    // Cat: bound -> brake into a stalking crouch -> wiggle -> pounce -> bat -> watch -> trot off. Always faces its travel direction.
    R.mt += dt;
    var v = 0, f = 0.0038;
    if (R.mode === "wait" && R.t >= R.catStart) { R.mode = "run"; R.mt = 0; }
    if (R.mode === "run") {
      v = R.vc;
      if (R.cx + v * dt >= R.stalkX) { R.mode = "brake"; R.mt = 0; R.bx = R.cx; R.bT = 2 * (R.pStart - R.cx) / R.vc; }
    }
    if (R.mode === "brake") {   // eases to a stop exactly at the pounce spot (no jumps)
      var b = Math.min(R.mt / R.bT, 1), nx = R.bx + (R.pStart - R.bx) * (2 * b - b * b);
      v = (nx - R.cx) / dt; R.cx = nx; f = 0.0038 * (0.45 + 0.55 * (1 - b));
      R.phi += f * dt; R.stride = Math.max(v, 1e-4) / (f * s);
      if (b >= 1) { R.mode = "crouch"; R.mt = 0; }
      return;
    }
    if (R.mode === "crouch") { if (R.mt > 760) { R.mode = "pounce"; R.mt = 0; } return; }
    if (R.mode === "pounce") {
      R.cx = R.pStart + pD(R.mt) * s;
      if (R.mt >= PT) { R.mode = "bat"; R.mt = 0; }
      return;
    }
    if (R.mode === "bat") {
      if (!R.nudged && R.mt >= HIT1) { R.nudged = true; R.nt = R.t; }
      if (!R.kicked && R.mt >= HIT2) { R.kicked = true; R.yv = R.v0 * 1.9; R.slen = Math.max(W, 320 * s); }   // unravels from here
      if (R.mt > BT) { R.mode = "watch"; R.mt = 0; }
      return;
    }
    if (R.mode === "watch") { if (R.mt > 560) { R.mode = "off"; R.mt = 0; R.cv = 0; } return; }
    if (R.mode === "off") { R.cv = Math.min(R.vt, R.cv + dt * R.vt / 380); v = R.cv; R.stride = 26.5; }
    R.cx += v * dt;
    if (R.mode === "run") { R.stride = R.vc / (f * s); }
    if (v) R.phi += v * dt / (R.stride * s);   // feet stay planted: stride matched to ground speed
    if (R.mode === "off" && R.cx > W + 40 * s && R.se > W + 4) { run = null; }   // the cat, the ball and the whole strand are gone
  }

  function catPose(R) {
    var m = R.mode, t = R.mt, v, w;
    if (m === "run") return CAT.gallop(R.phi, R.stride);
    if (m === "brake") {
      var b = Math.min(t / R.bT, 1); w = smooth((b - 0.3) / 0.7);
      v = CAT.lerp(CAT.gallop(R.phi, R.stride), PS.crouch, w);
      for (var k = 0; k < 4; k++) v[26 + k] = w > 0.55 ? 1 : v[26 + k] > 0.5 ? 1 : 0;
      return v;
    }
    if (m === "crouch") {   // eyes locked on the yarn; only the hindquarters wiggle, the hind feet tread
      v = PS.crouch.slice(); v[7] += 0.06 * Math.sin(Math.PI * clamp(t / 700, 0, 1));
      var wg = smooth((t - 330) / 120) * (1 - smooth((t - 690) / 70)), ph = (t - 330) * 0.036;
      v[0] += Math.sin(ph) * 0.7 * wg; v[1] -= (0.5 + Math.cos(ph * 2) * 0.35) * wg; v[4] += 0.3 * wg;
      var l1 = Math.max(0, Math.sin(ph)) * wg, l2 = Math.max(0, -Math.sin(ph)) * wg;
      v[18] -= l1 * 1.1; v[24] -= l2 * 1.1; v[27] = l1 > 0.15 ? 0 : 1; v[29] = l2 > 0.15 ? 0 : 1;
      v[12] += Math.sin(t * 0.010) * 0.25; v[13] += Math.sin(t * 0.010 - 0.8) * 0.45;   // tail tip twitch
      return v;
    }
    if (m === "pounce") {
      v = CAT.place(CAT.seq(POUNCE, t / PT), pLift(t), pPitch(t));
      var fp = t < 215 || t >= 455 ? 1 : 0, hp = t < 274 || t >= 565 ? 1 : 0;
      v[26] = v[28] = fp; v[27] = v[29] = hp;
      return v;
    }
    if (m === "bat") { v = CAT.seq(BAT, t / BT); v[26] = v[26] > 0.5 ? 1 : 0; return v; }
    if (m === "watch") { v = PS.bat0.slice(); v[7] += 0.24 * Math.sin(Math.PI * clamp(t / 560, 0, 1)); v[12] += Math.sin(t * 0.012) * 0.25; v[13] += Math.sin(t * 0.012 - 0.6) * 0.35; return v; }
    if (m === "off") {
      w = smooth(t / 420); v = CAT.lerp(PS.bat0, CAT.trot(R.phi, 26.5), w);
      for (k = 0; k < 4; k++) v[26 + k] = w < 0.25 ? 1 : v[26 + k] > 0.5 ? 1 : 0;
      return v;
    }
    return null;
  }

  // Feet: a planted paw is pinned to the ground in world space (no sliding); a paw that ends up far from where the
  // pose wants it takes a quick step; a paw that lifts eases from where it was into the pose's swing.
  function solveFeet(R, v, dt) {
    var cu = R.cx / R.s, F = R.feet, k, n = 0;
    if (!F) { F = R.feet = []; for (k = 0; k < 4; k++) F.push({ pl: v[26 + k] > 0.5, wx: cu + v[14 + 3 * k], x: v[14 + 3 * k], y: v[15 + 3 * k], a: v[16 + 3 * k], ox: 0, st: null }); }
    for (k = 0; k < 4; k++) if (F[k].st) n++;
    for (k = 0; k < 4; k++) {
      var f = F[k], i = 14 + 3 * k, want = v[26 + k] > 0.5;
      if (f.st) {
        f.st.t += dt / f.st.d; var u = Math.min(f.st.t, 1), e = smooth(u), ex = smooth(u / 0.78), tx = cu + v[i];   // travel first, then set down
        f.x = f.st.x0 + (tx - f.st.x0) * ex - cu; f.y = f.st.y0 * (1 - e) - f.st.h * Math.sin(Math.PI * u);
        f.a = lerp(f.st.a0, v[i + 2], e) - (k & 1 ? 0.5 : 0.9) * Math.sin(Math.PI * u);
        f.th = (k & 1 ? 0.7 : 1.1) * Math.sin(Math.PI * u);
        f.y -= CAT.drop(f.a, !(k & 1), f.th);
        if (u >= 1) { f.st = null; f.pl = true; f.wx = tx; f.x = v[i]; f.y = 0; n--; }
      } else if (want) {
        if (!f.pl) {
          if (f.y < -0.3) { f.st = { t: 0, d: 110, x0: cu + f.x, y0: f.y, a0: f.a, h: 0.6 }; n++; }
          else { f.pl = true; f.wx = cu + f.x; }
        } else if (R.canStep && n < 2 && Math.abs(f.wx - cu - v[i]) > 3.2) { f.st = { t: 0, d: 150, x0: f.wx, y0: 0, a0: f.a, h: 2.0 }; f.pl = false; n++; }
        if (f.pl) { f.x = f.wx - cu; f.y = 0; f.a = v[i + 2]; }
      } else {
        if (f.pl) { f.pl = false; f.ox = f.wx - cu - v[i]; }
        f.ox *= Math.exp(-dt / 45); f.x = v[i] + f.ox; f.y = v[i + 1]; f.a = v[i + 2];
      }
      v[i] = f.x; v[i + 1] = f.y; v[i + 2] = f.a; v[26 + k] = f.pl ? 1 : 0;
      if (f.st) v[30 + k] = f.th; else if (f.pl) v[30 + k] = 0;
    }
    if (!R.canStep) return;
    // a pinned paw the leg can no longer reach (the body has moved on) takes a step instead of being dragged
    var Q = CAT.reach(v);
    for (k = 0; k < 4; k++) {
      var g = F[k];
      if (g.pl && !g.st && Q[k] > 1.075) { g.st = { t: 0, d: 150, x0: g.wx, y0: 0, a0: g.a, h: 2.0 }; g.pl = false; n++; }
    }
  }

  // Tail: a light chain springing toward the pose's tail shape, stiffer at the root than the tip (overlap and
  // follow-through), and swinging against the body's acceleration. Simulated in the cat's own frame.
  function simTail(R, v, dt, acc) {
    var T = CAT.tail(v), n = T.length, S = R.tail, i, j;
    if (!S) { S = R.tail = T.map(function (p) { return { x: p[0], y: p[1], vx: 0, vy: 0 }; }); }
    var steps = Math.max(1, Math.ceil(dt / 4)), h = dt / steps;
    for (j = 0; j < steps; j++) {
      S[0].x = T[0][0]; S[0].y = T[0][1];
      for (i = 1; i < n; i++) {
        var q = S[i], fz = 4.5 + 10 * Math.pow(1 - i / (n - 1), 1.5), w = fz * 0.006283, z = 0.75;
        var ax = w * w * (T[i][0] - q.x) - 2 * z * w * q.vx - acc[0] * 0.2, ay = w * w * (T[i][1] - q.y) - 2 * z * w * q.vy - acc[1] * 0.2;
        q.vx += ax * h; q.vy += ay * h; q.x += q.vx * h; q.y += q.vy * h;
      }
      for (i = 1; i < n; i++) {   // keep segment lengths
        var p = S[i - 1], c = S[i], dx = c.x - p.x, dy = c.y - p.y, l = Math.sqrt(dx * dx + dy * dy) || 1, k2 = CAT.TS / l;
        c.x = p.x + dx * k2; c.y = p.y + dy * k2;
      }
    }
    return S.map(function (q) { return [q.x, q.y]; });
  }

  function catState(R, dt) {
    var v = catPose(R);
    if (!v) return null;
    R.canStep = R.mode !== "pounce" && R.mode !== "run";
    solveFeet(R, v, dt);
    // body acceleration (local units / ms^2) from the hip's world motion, lightly smoothed
    var hx = R.cx / R.s + v[0], hy = v[1], a = [0, 0];
    if (R.hip && dt > 0) {
      var vx = (hx - R.hip[0]) / dt, vy = (hy - R.hip[1]) / dt;
      if (R.hv) { a = [(vx - R.hv[0]) / dt, (vy - R.hv[1]) / dt]; }
      R.hv = [vx, vy];
    }
    R.hip = [hx, hy];
    R.acc = R.acc ? [R.acc[0] + (a[0] - R.acc[0]) * 0.3, R.acc[1] + (a[1] - R.acc[1]) * 0.3] : a;
    // belly / primordial pouch: a soft spring that sags and jiggles against vertical motion
    var w = 5.5 * 0.006283;
    R.pv += (-w * w * R.pouch - 2 * 0.35 * w * R.pv - R.acc[1] * 0.8) * dt; R.pouch += R.pv * dt;
    var pz = 0.9 * Math.tanh(R.pouch / 0.9);
    var m = R.mode, t = R.mt, o = { blink: 0, ear: 0, pouch: 0.25 + pz, belly: 0.1 + pz * 0.35 };
    o.tail = simTail(R, v, dt, R.acc);
    if (m === "crouch") { o.ear = Math.max(0, Math.sin(Math.PI * clamp((t - 120) / 200, 0, 1))); o.blink = Math.max(0, Math.sin(Math.PI * clamp((t - 520) / 130, 0, 1))); }
    if (m === "watch") { o.blink = Math.max(0, Math.sin(Math.PI * clamp((t - 120) / 130, 0, 1))); o.ear = Math.max(0, Math.sin(Math.PI * clamp((t - 300) / 180, 0, 1))); }
    return { v: v, o: o };
  }

  // ----- drawing -----
  function X(x) { return run.dir > 0 ? x : W - x; }

  function drawYarn(R) {
    var s = R.s, x = X(R.yx), y = R.g - R.r, rot = R.rot * R.dir, back = -R.dir;
    // the strand: from under the ball back to its free end, lying on the ground; pulled taut and wiggling near the
    // rolling ball, and wriggling at the free end while it is dragged
    var bx = R.yx - R.r * 0.7, Ls = Math.max(0, bx - R.se), n = Math.max(10, Math.min(400, Math.round(Ls / 3))), tt = R.t * 0.011;
    var wig = clamp(Math.abs(R.yspeed || 0) / R.v0, 0, 1.0) + 0.12, dw = clamp(R.sev / 0.2, 0, 1), L0 = 30 * s;
    ctx.strokeStyle = "rgba(" + PAPER + ",.34)"; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(x - R.dir * R.r * 0.7, y + R.r * 0.55);
    for (var i = 1; i <= n; i++) {
      var d = Ls * i / n, wx = bx - d, lift = Math.pow(Math.max(0, 1 - d / (R.r * 2.5)), 2) * R.r * 0.4;
      var yy = R.g - 0.6 - lift + Math.sin(tt - d / L0 * 7) * 2.2 * s * Math.min(d / L0, 1) * wig * Math.exp(-Math.max(0, d - L0) / (20 * s))
             + 0.5 * Math.sin((wx - R.se) * 0.11) * Math.min(1, d / (12 * s)) + Math.sin(tt * 1.3 + (Ls - d) * 0.15) * s * dw * Math.exp(-(Ls - d) / (25 * s));
      ctx.lineTo(X(wx), yy);
    }
    ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(" + AMBER + ",.66)";
    ctx.beginPath(); ctx.arc(x, y, R.r, 0, TAU); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R.r - 0.5, 0, TAU); ctx.clip();
    ctx.lineWidth = 0.75; ctx.strokeStyle = "rgba(" + AMBER + ",.5)";
    for (var k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x, y, R.r * 1.02, R.r * 0.36, rot + k * 1.05, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }

  function drawCat(R, dt) {
    var st = catState(R, dt);
    if (!st) return;
    R.last = st;
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, off.width, off.height);
    octx.setTransform(dpr * R.s * R.dir, 0, 0, dpr * R.s, dpr * X(R.cx), dpr * R.g);   // mirrored so the cat always faces where it is going
    CAT.draw(octx, st.v, BODY, FAR, st.o);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.56; ctx.filter = "blur(" + (0.35 * dpr).toFixed(2) + "px)";   // soft, fur-like edge
    ctx.drawImage(off, 0, 0); ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!run) return;
    drawYarn(run); drawCat(run, lastDt);
  }

  function frame(now) {
    var dt = last ? Math.min(now - last, 50) : 16; last = now; lastDt = dt;
    step(dt); draw();
    if (run) raf = requestAnimationFrame(frame);
    else { raf = 0; ctx.clearRect(0, 0, W, H); schedule(40000 + Math.random() * 40000); }
  }
  function start() { if (!raf && run && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); clearTimeout(timer); }
    else if (run) start();
    else schedule(Math.max(due - Date.now(), 1500));
  });
  // Test hook: ?cat=1 starts a run right away
  schedule(/[?&]cat=1\b/.test(location.search) ? 300 : 6000 + Math.random() * 6000);
})();
</script>
