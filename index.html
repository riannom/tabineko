<script>
(function () {

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // Local units: cat faces +x, ground at y=0, y grows downward; ~29 units to the ear tips: a round, short-legged house cat.
  var CAT = (function () {
    var FL1 = 5.3, FL2 = 5.2, FP = 2.4, HL1 = 6.0, HL2 = 5.6, HM = 4.0;

      var ff = o.ff || [o.fl[0] - 2, o.fl[1], o.fl[2]], hf = o.hf || [o.hl[0] - 2, o.hl[1], o.hl[2]];

    // then lifted, curled under and swung forward (digitigrade: the toe pad is the contact).

        var t = u / duty;

      }

    // Procedural gaits. kind "bound": chasing half-bound (forefeet, then both hind feet land ahead
    // in an overreach, gathered + extended flights). kind "trot": diagonal pairs, tail held up.

      bound: { duty: 0.24, off: [0, 0.07, 0.5, 0.56], lift: [5.5, 4.2], dip: 1.0, flight: 2.2, arch: 2.3, tb: 0.95, tw: 0.14 },

    };

      crouchBack: P({ h: [-10.2, -9.0], s: [7.6, -8.2], arch: 1.6, scap: 3.6, neck: -0.4, head: 0.5, fl: [11, 0, 1.15], hl: [-3.8, 0, 1.15], t: [Math.PI - 0.12, 0.04, 0.04, 0, -0.08, -0.15] }),
      land: P({ h: [-8, -14.5], s: [9, -9.5], arch: 2.2, neck: -0.55, head: 0.6, fl: [12.5, 0, 0.95], hl: [-2, -4, 0.7], t: TU(0.85) }),
      bat0: P({ h: [-7, -7.2], s: [6, -13.2], arch: 0.8, neck: -1.25, head: 1.15, fl: [8.5, 0, 0.9], hl: [-1, 0, 1.45], ff: [6.8, 0, 0.9], hf: [-2.5, 0, 1.45], t: TU(1.15) }),

      batHit: P({ h: [-6.8, -7.2], s: [6.6, -12.6], arch: 1.0, neck: -1.1, head: 1.05, fl: [14.5, -3, 0.45], hl: [-1, 0, 1.45], ff: [6.8, 0, 0.9], hf: [-2.5, 0, 1.45], t: TU(1.15) })
    };

    function lerpV(a, b, t) { var r = new Array(a.length); for (var i = 0; i < a.length; i++) r[i] = a[i] + (b[i] - a[i]) * t; return r; }

    }
    function gallop(phi, stride) { return gait(phi, "bound", stride || 58); }
    function trot(phi, stride) { return gait(phi, "trot", stride || 30); }
    // sequence of [t, pose] keys sampled with smooth (Catmull-Rom) interpolation, clamped at ends

      var jx = rx + Math.cos(a) * l1, jy = ry + Math.sin(a) * l1;
      var b2 = Math.atan2(ty - jy, tx - jx);
      return [jx, jy, jx + Math.cos(b2) * l2, jy + Math.sin(b2) * l2];
    }
    function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); }
    function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 6.2832); c.fill(); }
    function cap(c, ax, ay, ra, bx, by, rb) {

      var s = Math.max(-0.95, Math.min(0.95, (ra - rb) / L)), cs = Math.sqrt(1 - s * s);

    function paw(c, x, y, ang, rx, ry) {   // toe pad: lies along the "forward" of its bone
      var fx = Math.cos(ang), fy = -Math.sin(ang), dx = Math.sin(ang), dy = Math.cos(ang);

    }
    function fore(c, sx, sy, L, near) {
      var wx = L[0] - Math.sin(L[2]) * FP, wy = L[1] - Math.cos(L[2]) * FP;
      var j = ik(sx, sy, wx, wy, FL1, FL2, true);

      cap(c, j[0], j[1], 2.2, j[2], j[3], 1.8);

    }
    function hind(c, hx, hy, L, near) {

      var j = ik(hx, hy, kx, ky, HL1, HL2, false);

      cap(c, j[0], j[1], near ? 3.4 : 3.0, j[2], j[3], near ? 2.4 : 2.1);   // thick shin tapering to the hock

      var cx = (Hx + Sx) / 2 + upx * arch * 2, cy = (Hy + Sy) / 2 + upy * arch * 2;

      for (var k = 0; k <= 16; k++) {
        var t = k / 16, u = 1 - t;
        var bx = u * u * Hx + 2 * u * t * cx + t * t * Sx, by = u * u * Hy + 2 * u * t * cy + t * t * Sy;
        var tx = 2 * u * (cx - Hx) + 2 * t * (Sx - cx), ty = 2 * u * (cy - Hy) + 2 * t * (Sy - cy), tl = Math.sqrt(tx * tx + ty * ty);
        var nx2 = ty / tl, ny2 = -tx / tl;
        top.push([bx + nx2 * prof(UP, t), by + ny2 * prof(UP, t)]); bot.push([bx - nx2 * prof(DN, t), by - ny2 * prof(DN, t)]);
      }
      c.beginPath(); c.moveTo(top[0][0], top[0][1]);
      for (k = 1; k < top.length; k++) c.lineTo(top[k][0], top[k][1]);
      for (k = bot.length - 1; k >= 0; k--) c.lineTo(bot[k][0], bot[k][1]);
      c.closePath(); c.fill();
      circ(c, Hx - 0.9, Hy + 0.8, 6.2);                                  // plump haunch
      circ(c, Sx - 0.9, Sy - 0.3, 4.6);                                  // forechest, flush with the body line
      cap(c, Sx - 0.6, Sy, 4.0, Sx - 1.6 - v[5] * 0.25, Sy - 0.4 - v[5], 3.2);   // shoulder blade (rises under load / when stalking)
      // neck: scruff from withers to the back of the skull, throat from chest to chin, as one soft web
      var nbx = Sx + 1.0, nby = Sy - 2.4, hx = nbx + Math.cos(v[6]) * 4.6, hy = nby + Math.sin(v[6]) * 4.6;
      var ha = v[6] + v[7], ca = Math.cos(ha), sa = Math.sin(ha);
      function H(x, y) { return [hx + x * ca - y * sa, hy + x * sa + y * ca]; }
      var hb = H(-4.4, -2.2), hc = H(2.2, 4.4);
      cap(c, nbx, nby, 4.2, hx, hy, 4.2);
      c.beginPath(); c.moveTo(Sx - 3.4, Sy - 4.6);
      c.quadraticCurveTo(Sx - 0.2, Sy - 5.8, hb[0], hb[1]);
      c.lineTo(hc[0], hc[1]);
      c.quadraticCurveTo(Sx + 4.2, Sy + 1.2, Sx + 2.0, Sy + 3.6);
      c.lineTo(Sx - 3.4, Sy + 1.5); c.closePath(); c.fill();
      // head: a little wider than tall, cheek ruff, small muzzle and chin, short rounded ears set wide
      c.save(); c.translate(hx, hy); c.rotate(ha);
      ell(c, 0, 0, 5.9, 5.2, 0);
      ell(c, 0.5, 2.2, 5.1, 3.5, 0.08);                    // cheeks
      circ(c, -3.7, 2.7, 1.25); circ(c, -2.6, 3.9, 1.15); circ(c, -1.2, 4.6, 1.0);   // cheek ruff, slightly tufted
      ell(c, 4.85, 1.85, 1.85, 1.5, 0);                    // small muzzle
      ell(c, 3.7, 3.5, 1.45, 0.95, 0.15);                  // chin
      circ(c, 6.05, 1.0, 0.72);                            // nose bump
      function ear(a0, a1, at, rt, flick) {                 // rounded-tip ear on the side of the head
        at += flick; a0 += flick * 0.4; a1 += flick * 0.4;
        var r0 = 5.0, tx2 = Math.cos(at) * rt, ty2 = Math.sin(at) * rt;
        c.beginPath(); c.moveTo(Math.cos(a0) * r0, Math.sin(a0) * r0);
        c.quadraticCurveTo(Math.cos(at - 0.1) * (rt - 0.4), Math.sin(at - 0.1) * (rt - 0.4), tx2 + Math.cos(at - 1.57) * 0.45, ty2 + Math.sin(at - 1.57) * 0.45);
        c.quadraticCurveTo(tx2 + Math.cos(at) * 0.5, ty2 + Math.sin(at) * 0.5, tx2 + Math.cos(at + 1.57) * 0.45, ty2 + Math.sin(at + 1.57) * 0.45);
        c.quadraticCurveTo(Math.cos(at + 0.1) * (rt - 0.4), Math.sin(at + 0.1) * (rt - 0.4), Math.cos(a1) * r0, Math.sin(a1) * r0);
        c.closePath(); c.fill();
      }
      ear(-2.7, -1.9, -2.22, 8.4, 0);                      // far ear
      ear(-1.42, -0.6, -1.0, 8.5, -(opt.ear || 0) * 0.35);  // near ear (flicks back now and then)
      c.globalCompositeOperation = "destination-out";
      var bl = 1 - (opt.blink || 0) * 0.85;
      ell(c, 2.8, -0.5, 0.9, 0.82 * bl, 0);                // eye
      c.restore();
      c.fillStyle = body; c.beginPath();
      hind(c, Hx, Hy, [v[17], v[18], v[19]], true);
      fore(c, Sx - 1.4, Sy + 0.2, [v[14], v[15], v[16]], true);
      c.fill();
    }
    function forePaw(v) {   // where the near forepaw ends up (for spacing the bat)
      var L = [v[14], v[15], v[16]], wx = L[0] - Math.sin(L[2]) * FP, wy = L[1] - Math.cos(L[2]) * FP, j = ik(v[2], v[3], wx, wy, FL1, FL2, true);
      return [j[2] + Math.sin(L[2]) * FP, j[3] + Math.cos(L[2]) * FP];
    }
    return { gallop: gallop, trot: trot, steady: steady, seq: seq, lerp: lerpV, poses: poses, draw: draw, forePaw: forePaw };
  })();

  var PS = CAT.poses, REACH = CAT.forePaw(PS.batHit)[0] + 2.2;   // how far ahead of the cat its swipe lands
  var POUNCE = [[0, PS.crouch], [0.14, PS.crouchBack], [0.32, PS.launch], [0.6, PS.flight], [0.82, PS.landC], [1, PS.land]];   // weight back, push, arc, compress, recover
  var BAT = [[0, PS.land], [0.2, PS.batUp], [0.33, PS.batHit], [0.48, PS.batUp], [0.62, PS.batHit], [0.82, PS.bat0], [1, PS.bat0]];   // two quick pats

  function schedule(ms) { due = Date.now() + ms; clearTimeout(timer); if (!document.hidden) timer = setTimeout(begin, ms); }

  function begin() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var tag = document.querySelector("main p").getBoundingClientRect();
    var base = vw < 600 ? 1.05 : 1.62;
    var s = Math.min(base, (vh - tag.bottom - 30) / 40);      // keep the whole scene below the text
    if (s < 0.6) { schedule(40000 + Math.random() * 40000); return; }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = vw; H = Math.ceil(40 * s + 12);
    canvas.style.height = H + "px";
    canvas.width = off.width = Math.round(W * dpr); canvas.height = off.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = 4.2 * s, v0 = clamp(W / 4200, 0.18, 0.34);         // px per ms
    var stopX = W * (0.6 + Math.random() * 0.16);
    var T1 = 2 * (stopX + r) / v0;                             // yarn eases to a stop at stopX
    var vc = v0 * 1.15, vt = 0.1 * s, strideU = vc / 0.0037 / s, landX = stopX - r - REACH * s, pStart = landX - 46 * s, stalkX = pStart - vc * 150;
    run = { s: s, r: r, g: H - 6, v0: v0, vt: vt, strideU: strideU, tail: null, stopX: stopX, T1: T1, vc: vc, landX: landX, pStart: pStart, stalkX: stalkX,
            catStart: T1 + 200 - (stalkX + 60 * s) / vc,
            t: 0, yx: -r, yv: v0, rot: 0, kicked: false, cx: -60 * s, phi: 0, mode: "wait", mt: 0, cv: 0, dir: ltr ? 1 : -1 };
    ltr = !ltr;
    start();
  }

  function step(dt) {
    var R = run, s = R.s;
    R.t += dt;
    // Yarn
    var px = R.yx;
    if (!R.kicked) { var u = Math.min(R.t / R.T1, 1); R.yx = -R.r + (R.stopX + R.r) * ease(u); }
    else { R.yv = Math.max(R.yv * Math.pow(0.9995, dt), 0.2); R.yx += R.yv * dt; }
    R.yspeed = (R.yx - px) / dt;
    R.rot += (R.yx - px) / R.r;
    // Cat: gallop -> slow into a stalking crouch (with a little wiggle) -> pounce -> bat -> watch -> gallop off
    R.mt += dt;
    var v = 0;
    if (R.mode === "wait" && R.t >= R.catStart) { R.mode = "run"; R.mt = 0; }
    if (R.mode === "run") {
      v = R.vc;
      if (R.cx + v * dt >= R.stalkX) { R.mode = "stalk"; R.mt = 0; }
    } else if (R.mode === "stalk") {
      v = R.vc * (1 - smooth(R.mt / 450));
      if (R.mt > 1200) { R.mode = "pounce"; R.mt = 0; R.cx = R.pStart; }
    } else if (R.mode === "pounce") {
      R.cx = lerp(R.pStart, R.landX, smooth((R.mt - 110) / 400));
      if (R.mt >= 620) { R.mode = "bat"; R.mt = 0; }
    } else if (R.mode === "bat") {
      if (!R.kicked && R.mt > 0.62 * 640) { R.kicked = true; R.yv = R.v0 * 1.9; }
      if (R.mt > 640) { R.mode = "watch"; R.mt = 0; }
    } else if (R.mode === "watch") {
      if (R.mt > 560) { R.mode = "off"; R.mt = 0; R.cv = 0; }
    } else if (R.mode === "off") {
      R.cv = Math.min(R.vt, R.cv + dt * 0.0004); v = R.cv;
    }
    R.cx += v * dt;
    R.phi += v * dt / ((R.mode === "off" ? 30 : R.strideU) * s);   // feet stay planted: stride matched to ground speed
    if (R.mode === "off" && R.cx > W + 40 * s && R.yx > W + 60 * s) { run = null; }
  }

  function catPose(R) {
    var m = R.mode, t = R.mt, v;
    if (m === "run") return CAT.gallop(R.phi, R.strideU);
    if (m === "stalk") {
      v = CAT.lerp(CAT.gallop(R.phi, R.strideU), PS.crouch, smooth(t / 450)); v[7] += 0.12 * smooth(t / 450);   // eyes on the yarn
      var w = smooth((t - 420) / 160) * (1 - smooth((t - 1040) / 100)), ph = t * 0.034;   // cute butt wiggle
      v[0] += Math.sin(ph) * 1.1 * w; v[1] -= (0.8 + Math.cos(ph * 2) * 0.5) * w; v[4] -= 0.6 * w;
      v[18] -= Math.max(0, Math.sin(ph)) * 1.2 * w; v[24] -= Math.max(0, -Math.sin(ph)) * 1.2 * w;
      v[13] += Math.sin(t * 0.009) * 0.35;                     // tail tip twitch
      return v;
    }
    if (m === "pounce") return CAT.seq(POUNCE, t / 620);
    if (m === "bat") return CAT.seq(BAT, t / 640);
    if (m === "watch") { v = PS.bat0.slice(); v[7] += 0.28 * Math.sin(Math.PI * clamp(t / 560, 0, 1)); v[12] += Math.sin(t * 0.012) * 0.25; v[13] += Math.sin(t * 0.012 - 0.6) * 0.35; return v; }   // head tilt
    if (m === "off") return CAT.lerp(PS.bat0, CAT.trot(R.phi), smooth(t / 450));   // trots off, tail up
    return null;
  }

  // ----- drawing -----
  function X(x) { return run.dir > 0 ? x : W - x; }

  function drawYarn(R) {
    var s = R.s, x = X(R.yx), y = R.g - R.r, rot = R.rot * R.dir, back = -R.dir;
    // loose thread trailing behind, wiggling while it rolls
    var n = 16, len = 30 * s, wig = clamp(Math.abs(R.yspeed || 0) / R.v0, 0, 1.6) + 0.12, tt = R.t * 0.011;
    ctx.strokeStyle = "rgba(" + PAPER + ",.34)"; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(x + back * R.r * 0.7, y + R.r * 0.55);
    for (var i = 1; i <= n; i++) {
      var f = i / n;
      ctx.lineTo(x + back * (R.r * 0.7 + len * f), R.g - 0.6 - (1 - f) * R.r * 0.4 + Math.sin(tt - f * 7) * 2.2 * s * f * wig);
    }
    ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(" + AMBER + ",.66)";
    ctx.beginPath(); ctx.arc(x, y, R.r, 0, TAU); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R.r - 0.5, 0, TAU); ctx.clip();
    ctx.lineWidth = 0.75; ctx.strokeStyle = "rgba(" + AMBER + ",.5)";

  }

  function drawCat(R, dt) {
    var v = catPose(R);
    if (!v) return;
    // tail follow-through: each segment trails the one before it (overlapping action)
    if (!R.tail) R.tail = v.slice(8, 14);
    for (var i = 0; i < 6; i++) { var k = 1 - Math.exp(-dt / (70 + i * 26)); R.tail[i] += (v[8 + i] - R.tail[i]) * k; v[8 + i] = R.tail[i]; }
    var m = R.mode, t = R.mt, o = { blink: 0, ear: 0 };
    if (m === "stalk") { o.ear = Math.max(0, Math.sin(Math.PI * clamp((t - 180) / 200, 0, 1))); o.blink = Math.max(0, Math.sin(Math.PI * clamp((t - 760) / 130, 0, 1))); }
    if (m === "watch") { o.blink = Math.max(0, Math.sin(Math.PI * clamp((t - 120) / 130, 0, 1))); o.ear = Math.max(0, Math.sin(Math.PI * clamp((t - 300) / 180, 0, 1))); }
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, off.width, off.height);
    octx.setTransform(dpr * R.s * R.dir, 0, 0, dpr * R.s, dpr * X(R.cx), dpr * R.g);
    CAT.draw(octx, v, BODY, FAR, o);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.56; ctx.filter = "blur(" + (0.35 * dpr).toFixed(2) + "px)";   // soft, fur-like edge

  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!run) return;
    drawYarn(run); drawCat(run, lastDt);
  }

  function frame(now) {
    var dt = last ? Math.min(now - last, 50) : 16; last = now; lastDt = dt;
    step(dt); draw();
    if (run) raf = requestAnimationFrame(frame);
    else { raf = 0; ctx.clearRect(0, 0, W, H); schedule(40000 + Math.random() * 40000); }
  }
  function start() { if (!raf && run && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); clearTimeout(timer); }
    else if (run) start();
    else schedule(Math.max(due - Date.now(), 1500));
  });
  // Test hook: ?cat=1 starts a run right away
  schedule(/[?&]cat=1\b/.test(location.search) ? 300 : 6000 + Math.random() * 6000);
})();
</script>
