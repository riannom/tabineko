    R.rr = R.r * (1 - 0.1 * sq - 0.2 * clamp(((P.paid || P.paid0) - P.paid0) / (P.Lmax2 - P.paid0), 0, 1));
    R.rot = R.ha + ((P.paid || 0) - P.paid0) / R.r * 0.25;
  }

  function strandStyle() { ctx.strokeStyle = "rgba(" + PAPER + ",.34)"; ctx.lineWidth = 0.9; ctx.lineJoin = "round"; }
  function drawStrand(R) {
    var s = R.s, i, P = R.rope;
    strandStyle(); ctx.beginPath();
    if (P) {   // lying on the ground it shows a faint natural waviness
      var N = P.N, cum = 0, pts = [];
      for (i = N.length - 1; i >= 0; i--) {
        if (i < N.length - 1) cum += Math.hypot(N[i].x - N[i + 1].x, N[i].y - N[i + 1].y);
        var on = clamp(1 - (R.g - 0.6 - N[i].y) / 1.5, 0, 1), wq = clamp((P.ev || 0) / 0.08, 0, 1) * Math.exp(-cum / (12 * s));
        pts.push([X(N[i].x), N[i].y - 0.35 * (1 + Math.sin(cum * 0.11)) * on - wq * 0.7 * s * (0.5 + 0.5 * Math.sin(R.t * 0.018 + cum * 0.25))]);
      }
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
      ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      ctx.stroke(); return;
    }
    // before the grab: the short loose end flopping behind the ball
    if (!R.ytail) return;
    var bs0 = ballShape(R); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.ellipse(X(R.yx), bs0.cy, bs0.rx + 0.2, bs0.ry + 0.2, 0, 0, TAU); ctx.clip("evenodd"); strandStyle(); ctx.beginPath();
    var a = looseAt(R), Q = [[X(a[0]), a[1]]].concat(R.ytail.map(function (q) { return [X(q.x), q.y]; }));
    ctx.moveTo(Q[0][0], Q[0][1]);
    for (i = 1; i < Q.length - 1; i++) ctx.quadraticCurveTo(Q[i][0], Q[i][1], (Q[i][0] + Q[i + 1][0]) / 2, (Q[i][1] + Q[i + 1][1]) / 2);
    ctx.lineTo(Q[Q.length - 1][0], Q[Q.length - 1][1]);
    ctx.stroke(); ctx.restore();
  }

  function drawBall(R) {
    var r = R.held ? R.rr : R.r, x = X(R.held ? R.bp[0] : R.yx), y = R.held ? R.bp[1] : R.g - R.r, rot = R.rot * R.dir;
    if (!R.held) {   // soft and a little lumpy: squashes on contact, wobbles as it rolls
      var b = ballShape(R); y = b.cy;
      ctx.save(); ctx.translate(x, y); ctx.scale(b.rx / r, b.ry / r); ctx.translate(-x, -y);
      drawBallBody(x, y, r, rot); ctx.restore(); return;
    }
    drawBallBody(x, y, r, rot);
  }
  function drawBallBody(x, y, r, rot) {
    ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(" + AMBER + ",.66)";
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r - 0.5, 0, TAU); ctx.clip();
    ctx.lineWidth = 0.75; ctx.strokeStyle = "rgba(" + AMBER + ",.5)";
    var MN = [0.36, 0.52, 0.24];   // uneven wraps, so the turning reads clearly (no symmetric strobing)
    for (var k = 0; k < 3; k++) { var oa = rot + k * 2.1 + 0.4, ox = Math.cos(oa) * r * 0.1 * (k - 1), oy = Math.sin(oa) * r * 0.1 * (k - 1); ctx.beginPath(); ctx.ellipse(x + ox, y + oy, r * 1.02, r * MN[k], rot + k * 1.05, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }

  function soft(img) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.56; ctx.filter = "blur(" + (0.35 * dpr).toFixed(2) + "px)";   // soft, fur-like edge
    ctx.drawImage(img, 0, 0); ctx.restore();
  }
  function drawCat(R, st) {
    var T = [dpr * R.s * R.dir, 0, 0, dpr * R.s, dpr * X(R.cx), dpr * R.g];   // mirrored so the cat always faces where it is going
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, off.width, off.height);
    octx.setTransform(T[0], T[1], T[2], T[3], T[4], T[5]);
    CAT.draw(octx, st.v, BODY, FAR, st.o);
    if (!R.held) { soft(off); return; }
    var bx = (R.bp[0] - R.cx) / R.s, by = (R.bp[1] - R.g) / R.s, br = R.rr / R.s, L = CAT.lip(st.v), i;
    o2.setTransform(1, 0, 0, 1, 0, 0); o2.clearRect(0, 0, off2.width, off2.height);
    o2.save(); o2.setTransform(T[0], T[1], T[2], T[3], T[4], T[5]);
    var J = CAT.jaw(st.v, st.o.mouth || 0);   // upper lip above, lower jaw below: the ball sits between them
    o2.beginPath(); o2.moveTo(L[0][0], L[0][1]); for (i = 1; i < L.length; i++) o2.lineTo(L[i][0], L[i][1]); o2.closePath();
    o2.moveTo(J[0][0], J[0][1]); for (i = 1; i < J.length; i++) o2.lineTo(J[i][0], J[i][1]); o2.closePath(); o2.clip();
    o2.beginPath(); o2.arc(bx, by, br + 0.9 / R.s, 0, TAU); o2.clip();
    o2.setTransform(1, 0, 0, 1, 0, 0); o2.drawImage(off, 0, 0); o2.restore();
    octx.save(); octx.globalCompositeOperation = "destination-out"; octx.beginPath(); octx.arc(bx, by, br, 0, TAU); octx.fill(); octx.restore();
    soft(off); drawBall(R);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "destination-out"; ctx.globalAlpha = 0.85; ctx.filter = "blur(" + (0.35 * dpr).toFixed(2) + "px)"; ctx.drawImage(off2, 0, 0); ctx.restore();   // lip and jaw really hide the ball behind them
    soft(off2);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!run) return;
    var R = run, st = catState(R, lastDt);
    if (st) R.last = st;
    if (R.held && st) { simBall(R, st, lastDt); simRope(R, lastDt); }
    drawStrand(R);
    if (!R.held) drawBall(R);
    if (st) drawCat(R, st);
  }

  function frame(now) {
    var dt = last ? Math.min(now - last, 50) : 16; last = now; lastDt = dt;
    step(dt); draw();
    if (run) raf = requestAnimationFrame(frame);
    else { raf = 0; ctx.clearRect(0, 0, W, H); schedule(40000 + Math.random() * 40000); }
  }
  function start() { if (!raf && run && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); clearTimeout(timer); }
    else if (run) start();
    else schedule(Math.max(due - Date.now(), 1500));
  });
  // Test hook: ?cat=1 starts a run right away
  schedule(/[?&]cat=1\b/.test(location.search) ? 300 : 6000 + Math.random() * 6000);
})();
</script>
</body>
